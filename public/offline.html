<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0B3D2E" />
    <title>Verdanza - Hors ligne</title>
    <style>
      body {
        margin: 0;
        min-width: 320px;
        background: #faf8f2;
        color: #0b3d2e;
        font-family: Inter, system-ui, sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      section {
        max-width: 520px;
        border: 1px solid rgba(11, 61, 46, 0.12);
        border-radius: 8px;
        background: #fffdf7;
        padding: 28px;
      }

      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 2rem;
        line-height: 1.1;
      }

      p {
        margin: 16px 0 0;
        color: rgba(17, 17, 17, 0.72);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Connexion indisponible</h1>
        <p>
          Verdanza ne peut pas charger cette page pour le moment. Revenez en ligne
          pour consulter le catalogue, votre panier, le checkout ou votre compte.
        </p>
      </section>
    </main>
  </body>
</html>
