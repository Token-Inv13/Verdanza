<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0E3726" />
    <title>Verdanza - Hors ligne</title>
    <style>
      body {
        margin: 0;
        min-width: 320px;
        background: #fdf9f4;
        color: #0e3726;
        font-family: Inter, system-ui, sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      section {
        max-width: 520px;
        border: 1px solid rgba(14, 55, 38, 0.12);
        border-radius: 8px;
        background: #ffffff;
        padding: 28px;
      }

      img {
        display: block;
        width: 220px;
        max-width: 100%;
        height: auto;
        margin: 0 0 24px;
      }

      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 2rem;
        line-height: 1.1;
      }

      p {
        margin: 16px 0 0;
        color: rgba(17, 17, 17, 0.72);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <img
          src="/brand/verdanza-v1/logos/verdanza-logo-horizontal-compact-full-color.svg"
          alt="Verdanza"
          width="1391"
          height="302"
        />
        <h1>Connexion indisponible</h1>
        <p>
          Verdanza ne peut pas charger cette page pour le moment. Revenez en ligne
          pour consulter le catalogue, votre panier, le checkout ou votre compte.
        </p>
      </section>
    </main>
  </body>
</html>
