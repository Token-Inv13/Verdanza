name: CI — Verdanza

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stripe-test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java for Stripe Test
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21.0.12'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firestore emulator
        run: npm run prepare:cagnotte-firestore-emulator

      - name: Verify Stripe Test backend with owned emulator
        shell: bash
        run: |
          set -euo pipefail
          # Refuse an occupied port; never adopt or stop another process.
          node -e 'const s=require("node:net").createServer();s.on("error",e=>{console.error("Stripe emulator port unavailable",e.message);process.exit(1)});s.listen(18087,"127.0.0.1",()=>s.close());'
          java -jar node_modules/.cache/cagnotte/cloud-firestore-emulator-v1.22.0.jar \
            --host 127.0.0.1 --port 18087 --project_id demo-verdanza-stripe \
            --single_project_mode true --single_project_mode_error true \
            --rules firestore.stripe-test.rules > stripe-emulator.log 2>&1 &
          emulator_pid=$!
          cleanup() {
            result=$?
            trap - EXIT
            if kill -0 "$emulator_pid" 2>/dev/null; then
              kill "$emulator_pid"
            fi
            wait "$emulator_pid" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat stripe-emulator.log
              echo "Stripe emulator exited before readiness" >&2
              exit 1
            fi
            if node -e 'const s=require("node:net").connect(18087,"127.0.0.1");s.setTimeout(500);s.on("connect",()=>{s.destroy();process.exit(0)});s.on("error",()=>process.exit(1));s.on("timeout",()=>{s.destroy();process.exit(1)});'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat stripe-emulator.log
            echo "Stripe emulator 127.0.0.1:18087 not ready after 60 attempts" >&2
            exit 1
          fi
          npm run test:stripe-test
          npm run test:stripe-test:http

  windows-owned-process:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck interactive harness
        run: npm run typecheck:cagnotte-interactive

      - name: Verify Windows owned descendants
        run: node --import tsx scripts/cagnotte-interactive/testReliability.ts --windows-job-only

      - name: Upload sanitized Windows owned-process diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-owned-process-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: node_modules/.cache/verdanza-cagnotte-interactive/windows-owned-process-latest.json

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21.0.12'

      - name: Runtime versions
        run: |
          node --version
          npm --version
          java -version
          which java

      - name: Install dependencies
        run: npm ci

      - name: Prepare cagnotte Firestore emulator
        run: npm run prepare:cagnotte-firestore-emulator

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Prepare interactive cagnotte prerequisites
        run: npm run prepare:cagnotte-interactive

      - name: Verify
        run: npm run verify

      - name: Qualify cagnotte checkout handoff
        run: |
          npm run test:cagnotte-checkout-use
          npm run test:cagnotte-checkout-client
          npm run test:cagnotte-checkout-ui
          npm run test:cagnotte-security

      - name: Verify shared checkout and Stripe Test isolation
        run: |
          npm run typecheck:stripe-test
          npm run test:stripe-test:adapters
          npm run test:stripe-test:ui

      - name: Upload sanitized interactive diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cagnotte-interactive-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
          path: |
            node_modules/.cache/verdanza-cagnotte-interactive/latest-result.json
            node_modules/.cache/verdanza-cagnotte-interactive/latest-failure.json
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/execution-summary.json
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/browser-network.json
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/browser-console.json
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/firestore-listen-probe.json
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/cleanup.json
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/api-diagnostics.json
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/emulator-diagnostics.json
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/01-portefeuille-vide-*.png
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/04-devis-b-95-euros-*.png
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/06-remboursement-b-admin-*.png
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/07-solde-final-5-euros-*.png
            node_modules/.cache/verdanza-cagnotte-interactive/runs/*/08-api-indisponible-fail-closed-*.png
